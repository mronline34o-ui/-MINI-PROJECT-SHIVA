<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.in - Mini Project Clone</title>
    <style>
        /* CSS Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eaeded;
        }

        /* Top Navbar */
        header {
            background-color: #131921;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff9900;
            letter-spacing: -1px;
        }

        .search-bar {
            display: flex;
            flex: 1;
            max-width: 600px;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
            font-size: 15px;
        }

        .search-bar button {
            background-color: #febd69;
            border: none;
            padding: 0 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
        }

        .search-bar button:hover {
            background-color: #f3a847;
        }

        .cart-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .cart-count {
            background-color: #ff9900;
            color: #131921;
            padding: 2px 7px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 13px;
        }

        /* Sub Navbar (Categories) */
        .sub-nav {
            background-color: #232f3e;
            color: white;
            display: flex;
            align-items: center;
            padding: 8px 20px;
            gap: 20px;
            font-size: 14px;
            overflow-x: auto;
        }

        .sub-nav a {
            color: white;
            text-decoration: none;
            white-space: nowrap;
            padding: 4px 8px;
            border: 1px solid transparent;
            border-radius: 2px;
        }

        .sub-nav a:hover {
            border-color: white;
        }

        /* Main Container Layout */
        .main-container {
            max-width: 1280px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s ease;
        }

        .product-card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #0f1111;
            line-height: 1.3;
        }

        /* Enriched Product Details Styling */
        .product-rating {
            font-size: 13px;
            color: #007185;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stars {
            color: #ffa41c;
            letter-spacing: 1px;
        }

        .review-count {
            color: #007185;
        }

        .product-price {
            color: #0f1111;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .product-price span {
            font-size: 12px;
            font-weight: normal;
            color: #565959;
        }

        .delivery-badge {
            font-size: 12px;
            color: #565959;
            margin-bottom: 12px;
        }

        .delivery-badge span {
            font-weight: bold;
            color: #0f1111;
        }

        .add-to-cart-btn {
            background-color: #ffd814;
            border: 1px solid #fcd200;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(213,217,217,.5);
        }

        .add-to-cart-btn:hover {
            background-color: #f7ca00;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 130px;
        }

        .cart-sidebar h2 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            color: #0f1111;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .cart-item-details {
            flex: 1;
            margin-right: 10px;
        }

        .remove-btn {
            background: #cc0c39;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        .remove-btn:hover {
            background: #b12704;
        }

        .cart-total {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            color: #0f1111;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Primary Header -->
    <header>
        <div class="logo">Amazon.in</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Amazon.in products...">
            <button>🔍</button>
        </div>
        <button class="cart-btn">
            🛒 Cart <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <!-- Secondary Category Navbar -->
    <nav class="sub-nav">
        <a href="#">☰ All</a>
        <a href="#">Best Sellers</a>
        <a href="#">Mobiles</a>
        <a href="#">Customer Service</a>
        <a href="#">Electronics</a>
        <a href="#">Prime</a>
        <a href="#">Fashion</a>
        <a href="#">New Releases</a>
    </nav>

    <!-- Main Content Layout -->
    <div class="main-container">
        <!-- Left: Product Grid -->
        <main class="product-grid" id="productGrid">
            <!-- Dynamically populated by JS -->
        </main>

        <!-- Right: Shopping Cart Sidebar -->
        <aside class="cart-sidebar">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems">
                <p style="color: #565959; font-size: 13px;">Your Cart is empty.</p>
            </div>
            <div class="cart-total" id="cartTotal">
                Subtotal (0 items): ₹0
            </div>
        </aside>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Enhanced Product Database with ratings, reviews, and delivery tags
        const products = [
            { id: 1, name: "Wireless Bluetooth Earbuds with ANC", price: 1499, rating: 4.2, reviews: 2450, image: "earbuds.png" },
            { id: 2, name: "Smart Fitness Watch with Heart Rate Monitor", price: 2499, rating: 4.0, reviews: 1120, image: "smartwatch.png" },
            { id: 3, name: "Mechanical RGB Gaming Keyboard", price: 2999, rating: 4.5, reviews: 3890, image: "keyboard.png" },
            { id: 4, name: "Ergonomic Silent Office Wireless Mouse", price: 799, rating: 4.3, reviews: 890, image: "mouse.png" },
            { id: 5, name: "Portable 10000mAh Fast Charging Power Bank", price: 1299, rating: 4.4, reviews: 5210, image: "powerbank.png" },
            { id: 6, name: "1080p HD Web Camera with Built-in Mic", price: 1899, rating: 4.1, reviews: 670, image: "webcam.png" }
        ];

        // Load cart from localStorage or start empty
        let cart = JSON.parse(localStorage.getItem('amazon_cart')) || [];

        // DOM Elements
        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const cartItemsContainer = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');

        // Helper function to generate star symbols based on rating number
        function getStars(rating) {
            let fullStars = Math.floor(rating);
            return '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
        }

        // 1. Render Products to the Grid
        function renderProducts(productsToDisplay) {
            productGrid.innerHTML = '';
            
            if (productsToDisplay.length === 0) {
                productGrid.innerHTML = '<p>No products found.</p>';
                return;
            }

            productsToDisplay.forEach(product => {
                const card = document.createElement('div');
                card.classList.add('product-card');
                card.innerHTML = `
                    <div>
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-title">${product.name}</div>
                        <div class="product-rating">
                            <span class="stars">${getStars(product.rating)}</span>
                            <span class="review-count">${product.reviews.toLocaleString('en-IN')}</span>
                        </div>
                        <div class="product-price">₹${product.price.toLocaleString('en-IN')} <span>M.R.P</span></div>
                        <div class="delivery-badge">FREE delivery by <span>Tomorrow</span></div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                `;
                productGrid.appendChild(card);
            });
        }

        // 2. Add Item to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            saveAndRenderCart();
        }

        // 3. Remove Item from Cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            saveAndRenderCart();
        }

        // 4. Save to LocalStorage and Update UI
        function saveAndRenderCart() {
            localStorage.setItem('amazon_cart', JSON.stringify(cart));
            renderCart();
        }

        // 5. Render Cart Sidebar
        function renderCart() {
            cartCount.innerText = cart.length;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #565959; font-size: 13px;">Your Cart is empty.</p>';
                cartTotal.innerText = 'Subtotal (0 items): ₹0';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const cartItemDiv = document.createElement('div');
                cartItemDiv.classList.add('cart-item');
                cartItemDiv.innerHTML = `
                    <div class="cart-item-details">
                        <div>${item.name}</div>
                        <div style="font-weight: bold; color: #0f1111;">₹${item.price.toLocaleString('en-IN')}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">Delete</button>
                `;
                cartItemsContainer.appendChild(cartItemDiv);
            });

            cartTotal.innerText = `Subtotal (${cart.length} items): ₹${total.toLocaleString('en-IN')}`;
        }

        // 6. Real-time Search Filter
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filteredProducts = products.filter(p => 
                p.name.toLowerCase().includes(query)
            );
            renderProducts(filteredProducts);
        });

        // Initialize Page Load
        renderProducts(products);
        renderCart();
    </script>
</body>
</html>
